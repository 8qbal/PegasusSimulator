slam_toolbox:
  ros__parameters:
    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames (TF chain: slam_map -> odom -> v1__base_link -> rplidar_c1):
    # - "odom" -> "v1__base_link" is published by px4_odom_tf_bridge.py from PX4's EKF2
    #   odometry (the motion prior; NOT ground truth - see that node's header).
    # - "v1__base_link" -> "rplidar_c1" is the static lidar-mount TF (run_slam.sh).
    # - slam_toolbox estimates the "slam_map" -> "odom" drift correction and publishes the
    #   drone pose in "slam_map" on /pose, which px4_vision_bridge feeds back to PX4 as EV.
    odom_frame: odom
    map_frame: slam_map
    base_frame: v1__base_link
    scan_topic: /v1_0/rplidar_c1/laserscan
    use_scan_matching: true
    mode: mapping

    # Timing / rates (lidar publishes at ~10 Hz)
    transform_publish_period: 0.05
    map_update_interval: 2.0
    minimum_time_interval: 0.2
    transform_timeout: 0.5
    tf_buffer_duration: 30.0

    # Example_Rotary_2D reaches far; clamp to something RPLIDAR-C1-like (12 m)
    max_laser_range: 12.0
    resolution: 0.05

    # Scan matcher tuning (defaults are fine for a first bring-up)
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 12.0
    do_loop_closing: true
    loop_search_maximum_distance: 5.0

    debug_logging: false
    throttle_scans: 1
    stack_size_to_use: 40000000
    enable_interactive_mode: false
